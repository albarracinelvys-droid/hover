name: HOVER NEXT Tests
on:
  push:
    paths:
      - 'HOVER_NEXT/**'
      - '.github/workflows/hover-next-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'openpyxl>=3.1,<4' 'python-docx>=1.1,<2' 'dateparser>=1.2,<2'
      - name: Compile Python modules
        working-directory: HOVER_NEXT
        run: python -m compileall -q hover_next tests
      - name: Unit tests
        working-directory: HOVER_NEXT
        run: python -m unittest discover -s tests -v
